storage:
  enabled: true
  content_storage_enabled: true
  keep_arxiv_version: false
search:
  sources:
  - arxiv
  max_results: 3
  pull_every: 7
  fill_enabled: true
  max_lookback_days: 30
  arxiv_min_interval_seconds: 12.0
queries:
- NAME: Deep Learning
  OR:
  - deep learning
  - neural network
  NOT:
  - survey
  CATEGORY:
    OR:
    - cs.LG
    - cs.CV
- NAME: LLM Research
  OR:
  - large language model
  - LLM
  NOT:
  - law
  - legal
  CATEGORY:
    OR:
    - cs.CL
    - cs.AI
- NAME: test query
  OR:
  - test query
output:
  base_dir: output/
  formats:
  - console
  - markdown
  - html
llm:
  enabled: false
  enable_translation: false
  enable_summary: false
  target_lang: Simplified Chinese

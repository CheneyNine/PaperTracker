log:
  level: INFO

queries:
  - NAME: arxiv_rate_limit_validation
    OR:
      - large language model

search:
  sources: [arxiv]
  max_results: 2
  pull_every: 30
  fill_enabled: true
  max_lookback_days: 365
  max_fetch_items: 50
  fetch_batch_size: 25
  arxiv_min_interval_seconds: 8.0

output:
  base_dir: output
  formats: [console]

llm:
  enabled: false

services:
  app:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./config:/app/config:ro
      - ./database:/app/database
    environment:
      - DATABASE_URL=postgresql://paper_tracker:${POSTGRES_PASSWORD}@postgres:5432/paper_tracker
      - STORAGE_BACKEND=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paper_tracker
      POSTGRES_USER: paper_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_tracker -d paper_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
